<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Calculator - Mobile (Empty)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#fcf8fd",
                        "surface-container-highest": "#e5e1e6",
                        "on-background": "#1c1b1f",
                        "primary": "#070235",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#c0c1ff",
                        "on-surface-variant": "#47464f",
                        "surface-container": "#f1ecf2",
                        "on-tertiary-container": "#ae7f59",
                        "on-secondary-container": "#fffbff",
                        "on-primary-container": "#8683ba",
                        "tertiary-fixed-dim": "#f1bc91",
                        "surface-container-low": "#f6f2f7",
                        "primary-container": "#1e1b4b",
                        "tertiary-container": "#371a00",
                        "secondary-container": "#6063ee",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffdcc2",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e5e1e6",
                        "secondary": "#4648d4",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#f3eff4",
                        "tertiary": "#160700",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#07006c",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "outline": "#787680",
                        "secondary-fixed": "#e1e0ff",
                        "on-error-container": "#93000a",
                        "background": "#fcf8fd",
                        "surface-bright": "#fcf8fd",
                        "outline-variant": "#c8c5d0",
                        "on-tertiary-fixed-variant": "#633e1e",
                        "on-tertiary-fixed": "#2e1500",
                        "primary-fixed": "#e3dfff",
                        "surface-dim": "#dcd9de",
                        "surface-container-high": "#ebe7ec",
                        "on-surface": "#1c1b1f",
                        "inverse-primary": "#c4c1fb",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#444173",
                        "surface-tint": "#5b598c",
                        "primary-fixed-dim": "#c4c1fb",
                        "inverse-surface": "#313034",
                        "on-primary-fixed": "#181445"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "section_margin": "32px",
                        "gutter": "16px",
                        "card_padding": "24px",
                        "container_max_width": "1024px",
                        "stack_gap": "12px",
                        "element_height": "40px"
                    },
                    "fontFamily": {
                        "body-base": ["Inter"],
                        "h1": ["Inter"],
                        "body-sm": ["Inter"],
                        "h3": ["Inter"],
                        "label-caps": ["Inter"],
                        "h2": ["Inter"],
                        "currency": ["Inter"]
                    },
                    "fontSize": {
                        "body-base": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "h1": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "h3": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "h2": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "currency": ["16px", { "lineHeight": "24px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-base min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<nav class="bg-white dark:bg-slate-900 font-['Inter'] text-sm antialiased tracking-tight docked full-width top-0 border-b border-b border-slate-200 dark:border-slate-800 shadow-sm dark:shadow-none flex justify-between items-center h-16 max-w-[1024px] mx-auto px-4 md:px-8 w-full z-50">
<div class="text-lg font-bold text-slate-900 dark:text-slate-50 tracking-wide">
            Silver Cross Bonus Calculator
        </div>
<!-- Mobile menu button (visual only for this scope) -->
<button class="md:hidden p-2 text-slate-500 hover:text-slate-900 focus:outline-none">
<span class="material-symbols-outlined">menu</span>
</button>
<!-- Desktop Nav Items -->
<div class="hidden md:flex gap-6 h-full items-center">
<a class="text-indigo-900 dark:text-indigo-400 font-bold border-b-2 border-indigo-900 dark:border-indigo-400 pb-4 mt-4 cursor-pointer active:opacity-80 transition-opacity hover:text-indigo-900 dark:hover:text-indigo-300 transition-all duration-200" href="#">Calculator</a>
<a class="text-slate-500 dark:text-slate-400 font-medium hover:text-slate-900 dark:hover:text-slate-100 transition-colors cursor-pointer active:opacity-80 transition-opacity hover:text-indigo-900 dark:hover:text-indigo-300 transition-all duration-200 h-full flex items-center mt-[18px]" href="#">History</a>
</div>
</nav>
<!-- Main Content -->
<main class="flex-grow w-full max-w-container_max_width mx-auto px-gutter py-section_margin flex flex-col gap-stack_gap md:flex-row md:items-start md:gap-gutter">
<!-- Deal Details Form (Mobile Stacked) -->
<section class="w-full md:w-1/2 flex flex-col gap-stack_gap">
<div class="bg-surface-container-lowest rounded-xl border border-surface-container-highest p-card_padding shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05),0_2px_4px_-1px_rgba(0,0,0,0.03)]">
<h2 class="font-h3 text-h3 text-on-surface mb-6 border-b border-surface-variant pb-2">Deal Details</h2>
<form class="space-y-4">
<!-- Product Selection -->
<div>
<label class="block font-body-sm text-body-sm text-on-surface-variant mb-1" for="product">Product</label>
<select class="w-full h-element_height bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-3 text-on-surface font-body-base focus:border-primary focus:ring-1 focus:ring-primary outline-none" id="product">
<option disabled="" selected="" value="">Select product...</option>
<option value="prod_a">Product A (100mg)</option>
<option value="prod_b">Product B (250mg)</option>
<option value="prod_c">Product C (500mg)</option>
</select>
</div>
<!-- Base Price -->
<div>
<label class="block font-body-sm text-body-sm text-on-surface-variant mb-1" for="base-price">Base Price per Unit (₹)</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-outline font-currency text-currency">₹</span>
<input class="w-full h-element_height bg-surface-container-lowest border border-outline-variant rounded-DEFAULT pl-8 pr-3 text-on-surface font-currency text-currency focus:border-primary focus:ring-1 focus:ring-primary outline-none placeholder-outline-variant" id="base-price" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Quantity -->
<div>
<label class="block font-body-sm text-body-sm text-on-surface-variant mb-1" for="quantity">Quantity</label>
<input class="w-full h-element_height bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-3 text-on-surface font-body-base focus:border-primary focus:ring-1 focus:ring-primary outline-none placeholder-outline-variant" id="quantity" placeholder="0" type="number"/>
</div>
<!-- Calculate Button -->
<button class="w-full h-element_height bg-primary text-on-primary font-body-base font-medium rounded-DEFAULT hover:shadow-[0_4px_6px_-1px_rgba(0,0,0,0.1),0_2px_4px_-1px_rgba(0,0,0,0.06)] transition-shadow mt-4" type="button">
                        Calculate Bonus
                    </button>
</form>
</div>
</section>
<!-- Empty Result State (Stacked below on mobile) -->
<section class="w-full md:w-1/2">
<div class="bg-surface-container-lowest rounded-xl border border-surface-container-highest p-card_padding shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05),0_2px_4px_-1px_rgba(0,0,0,0.03)] h-full flex flex-col items-center justify-center min-h-[300px] text-center">
<span class="material-symbols-outlined text-outline-variant text-[64px] mb-4" style="font-size: 64px;">calculate</span>
<h3 class="font-h3 text-h3 text-on-surface mb-2">No Calculation Yet</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[250px]">
                    Enter price and quantities in the details form to see the bonus breakdown.
                </p>
</div>
</section>
</main>
</body></html>
